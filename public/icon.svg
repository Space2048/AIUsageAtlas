<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AIUsageAtlas">
  <!-- AIUsageAtlas 品牌图标：珊瑚渐变圆角砖 + 白色 A（与顶栏 brand-mark 同源） -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a6c"/>
      <stop offset="1" stop-color="#f4643c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- A 的两笔（顶点相交，圆角连接） -->
    <path d="M140 386 L256 182 L372 386" stroke-width="66"/>
    <!-- 横杠，略细于竖笔做视觉平衡 -->
    <path d="M183 310 L329 310" stroke-width="58"/>
  </g>
</svg>
